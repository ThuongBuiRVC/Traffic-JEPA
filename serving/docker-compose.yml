services:
  caption-server:
    image: vllm/vllm-openai:latest
    container_name: traffic-jepa-caption
    runtime: nvidia
    network_mode: host                    # the endpoint lands on http://<host>:8100/v1
    ipc: host
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ../checkpoints/caption_lora:/adapters/caption_lora:ro
      - ../checkpoints/caption_lora_mm:/adapters/caption_lora_mm:ro
    command: >
      --model Qwen/Qwen3-VL-8B-Instruct
      --served-model-name qwen3-vl-8b
      --port 8100
      --api-key not-needed
      --enable-prefix-caching
      --gpu-memory-utilization 0.92
      --max-model-len 8192
      --enable-lora
      --max-lora-rank 16
      --lora-modules caption_lora=/adapters/caption_lora caption_lora_mm=/adapters/caption_lora_mm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
